name: Build Resume

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build_latex:
    runs-on: ubuntu-latest
    strategy:
      # 某个岗位编译失败时，其余岗位仍然继续构建
      fail-fast: false
      matrix:
        # 岗位清单名，必须与 profiles/<名字>.tex 一致；加岗位时在此追加
        profile: [ CV, CV-agent, CV-neural ]
    steps:
      - name: Set up Git repository
        uses: actions/checkout@v4

      - name: Compile LaTeX document
        uses: xu-cheng/latex-action@v3
        with:
          root_file: CV.tex
          latexmk_use_xelatex: true
          # -jobname 决定产出文件名，也决定 CV.tex 去读 profiles/ 下的哪份清单
          args: -jobname=${{ matrix.profile }}
          # 由于你的字体在本地 fonts 文件夹中，且使用了 Path 参数，通常不需要额外安装字体
          # 如果遇到字体问题，可以在这里配置

      - name: Upload PDF as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.profile }}-PDF
          path: ${{ matrix.profile }}.pdf
          if-no-files-found: error
